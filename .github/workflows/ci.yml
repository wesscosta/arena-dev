name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Java 21, PostgreSQL and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend gate
        run: mvn -B -ntp verify

  frontend:
    name: Frontend — tests, TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Check release formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

  e2e:
    name: Compose and E2E — Chromium critical flows
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [backend, frontend]
    env:
      APP_TEACHER_USERNAME: professor
      APP_TEACHER_PASSWORD: e2e-safe-password
      E2E_TEACHER_USERNAME: professor
      E2E_TEACHER_PASSWORD: e2e-safe-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release metadata and scripts
        run: |
          bash -n scripts/release/*.sh scripts/arena.sh
          scripts/release/check-metadata.sh --require-license
          if [[ -f backend/src/main/resources/db/migration/V56__manual_score_create_idempotency.sql || -f backend/src/main/resources/db/migration/V55__learner_confidence_opt_in.sql ]]; then
            scripts/release/verify-v0.10-contract.sh
          else
            scripts/release/verify-v0.9-contract.sh
          fi

      - name: Verify fail-closed v0.11 operational acceptance template
        run: |
          python3 -m unittest discover -s scripts/release/tests -p 'test_*.py' -v
          python3 scripts/release/v011-readiness.py --attestation docs/v0.11/11.6_ACCEPTANCE_TEMPLATE.json --check-template

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and WebKit
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate production Compose model
        env:
          POSTGRES_PASSWORD: ci-production-database-password
          APP_FRONTEND_URL: https://arena.example.test
          APP_ALLOWED_ORIGIN_PATTERNS: https://arena.example.test
          APP_TEACHER_USERNAME: professor
          APP_TEACHER_PASSWORD: ci-production-teacher-password
          NEXT_PUBLIC_API_URL: https://api.arena.example.test
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start application stack
        run: docker compose up --detach --wait

      - name: Verify non-root runtime containers
        run: |
          test "$(docker compose exec -T backend id -un)" = "arena"
          test "$(docker compose exec -T frontend id -un)" = "arena"

      - name: Run Chromium critical flows
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Validate iOS-like WebKit mobile presentation and security
        working-directory: frontend
        run: npm run test:e2e -- --project=webkit-mobile --grep 'v0.11 / 11.[246]'

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
