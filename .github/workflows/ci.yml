name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Java 21, PostgreSQL and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend gate
        run: mvn -B -ntp verify

  frontend:
    name: Frontend — tests, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

  e2e:
    name: Compose and E2E — Chromium v0.4 critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    env:
      APP_TEACHER_USERNAME: professor
      APP_TEACHER_PASSWORD: e2e-safe-password
      E2E_TEACHER_USERNAME: professor
      E2E_TEACHER_PASSWORD: e2e-safe-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release metadata and scripts
        run: |
          bash -n scripts/release/*.sh
          scripts/release/check-metadata.sh --require-license

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate production Compose model
        env:
          POSTGRES_PASSWORD: ci-production-database-password
          APP_FRONTEND_URL: https://arena.example.test
          APP_ALLOWED_ORIGIN_PATTERNS: https://arena.example.test
          APP_TEACHER_USERNAME: professor
          APP_TEACHER_PASSWORD: ci-production-teacher-password
          NEXT_PUBLIC_API_URL: https://api.arena.example.test
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start application stack
        run: docker compose up --detach --wait

      - name: Verify non-root runtime containers
        run: |
          test "$(docker compose exec -T backend id -un)" = "arena"
          test "$(docker compose exec -T frontend id -un)" = "arena"

      - name: Run browser critical flows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
