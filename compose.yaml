services:

  postgres:
    image: postgres:17-alpine
    container_name: arena-dev-postgres

    environment:
      POSTGRES_DB: arena_dev
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena_dev"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: arena-dev-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arena_dev
      SPRING_DATASOURCE_USERNAME: arena
      SPRING_DATASOURCE_PASSWORD: arena123

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: arena-dev-frontend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  postgres_data:
