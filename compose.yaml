services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arena_dev}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena123}
    ports:
      # Loopback only: on a classroom LAN a published database with the default
      # password is reachable by every device on the Wi-Fi. Set POSTGRES_BIND
      # to 0.0.0.0 only if another machine must reach it.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-arena_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-arena}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-arena123}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_ALLOWED_ORIGIN_PATTERNS: ${APP_ALLOWED_ORIGIN_PATTERNS:-http://*:[3000]}
      APP_TEACHER_USERNAME: ${APP_TEACHER_USERNAME:-professor}
      APP_TEACHER_PASSWORD: ${APP_TEACHER_PASSWORD:-arena-dev-change-me}
      APP_TEACHER_SESSION_TIMEOUT_MINUTES: ${APP_TEACHER_SESSION_TIMEOUT_MINUTES:-240}
      APP_LOGIN_RATE_LIMIT_MAX_FAILURES: ${APP_LOGIN_RATE_LIMIT_MAX_FAILURES:-5}
      APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_LOGIN_RATE_LIMIT_BLOCK_SECONDS: ${APP_LOGIN_RATE_LIMIT_BLOCK_SECONDS:-300}
      APP_LEARNING_CORE_QUIZ_SHADOW_ENABLED: ${APP_LEARNING_CORE_QUIZ_SHADOW_ENABLED:-true}
      APP_LEARNING_CORE_POLL_SHADOW_ENABLED: ${APP_LEARNING_CORE_POLL_SHADOW_ENABLED:-true}
      APP_LEARNING_CORE_WORD_CLOUD_SHADOW_ENABLED: ${APP_LEARNING_CORE_WORD_CLOUD_SHADOW_ENABLED:-true}
      APP_LEARNING_CORE_CUTOVER_MINIMUM_TERMINAL_ROUNDS: ${APP_LEARNING_CORE_CUTOVER_MINIMUM_TERMINAL_ROUNDS:-3}
      APP_LEARNING_CORE_CUTOVER_SAMPLE_SIZE: ${APP_LEARNING_CORE_CUTOVER_SAMPLE_SIZE:-200}
      APP_INTEGRATIONS_MICROSOFT_CLIENT_ID: ${APP_INTEGRATIONS_MICROSOFT_CLIENT_ID:-}
      APP_INTEGRATIONS_MICROSOFT_CLIENT_SECRET: ${APP_INTEGRATIONS_MICROSOFT_CLIENT_SECRET:-}
      APP_INTEGRATIONS_MICROSOFT_REDIRECT_URI: ${APP_INTEGRATIONS_MICROSOFT_REDIRECT_URI:-http://localhost:8080/api/integrations/microsoft/oauth/callback}
      APP_INTEGRATIONS_GOOGLE_CLIENT_ID: ${APP_INTEGRATIONS_GOOGLE_CLIENT_ID:-}
      APP_INTEGRATIONS_GOOGLE_CLIENT_SECRET: ${APP_INTEGRATIONS_GOOGLE_CLIENT_SECRET:-}
      APP_INTEGRATIONS_GOOGLE_REDIRECT_URI: ${APP_INTEGRATIONS_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/integrations/google/oauth/callback}
      APP_INTEGRATIONS_NOTION_TOKEN: ${APP_INTEGRATIONS_NOTION_TOKEN:-}
      APP_INTEGRATIONS_NOTION_API_VERSION: ${APP_INTEGRATIONS_NOTION_API_VERSION:-2022-06-28}
      APP_INTEGRATIONS_NOTION_BASE_URL: ${APP_INTEGRATIONS_NOTION_BASE_URL:-https://api.notion.com/v1}
      APP_INTEGRATIONS_NOTION_CLIENT_ID: ${APP_INTEGRATIONS_NOTION_CLIENT_ID:-}
      APP_INTEGRATIONS_NOTION_CLIENT_SECRET: ${APP_INTEGRATIONS_NOTION_CLIENT_SECRET:-}
      APP_INTEGRATIONS_NOTION_REDIRECT_URI: ${APP_INTEGRATIONS_NOTION_REDIRECT_URI:-http://localhost:8080/api/integrations/notion/oauth/callback}
      APP_INTEGRATIONS_CREDENTIAL_ENCRYPTION_KEY: ${APP_INTEGRATIONS_CREDENTIAL_ENCRYPTION_KEY:-}
      APP_ACTIVITY_OPTION_SECRET: ${APP_ACTIVITY_OPTION_SECRET:-}
      ARENA_AI_API_KEY: ${ARENA_AI_API_KEY:-}
      ARENA_AI_MODEL: ${ARENA_AI_MODEL:-gpt-5.6-luna}
      ARENA_AI_BASE_URL: ${ARENA_AI_BASE_URL:-https://api.openai.com/v1}
    ports:
      # Loopback only: browsers reach /api and /ws through the frontend proxy,
      # which forwards the real client address (trusted only from Compose).
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_ARENA_SELECTOR_MODE: ${NEXT_PUBLIC_ARENA_SELECTOR_MODE:-grid-spotlight}
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_ARENA_SELECTOR_MODE: ${NEXT_PUBLIC_ARENA_SELECTOR_MODE:-grid-spotlight}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
