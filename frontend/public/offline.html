<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Arena Dev · Sem conexão</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));font:16px/1.5 system-ui,sans-serif;background:#0b1020;color:#f8fafc}.card{width:min(460px,100%);padding:24px;border:1px solid #263149;border-radius:20px;background:#111827}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#7c3aed;font-weight:900;font-size:22px}h1{margin:18px 0 8px;font-size:26px}p{margin:0;color:#cbd5e1}.note{margin-top:18px;padding:13px;border-radius:12px;background:#172033;color:#cbd5e1;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">A</div>
    <h1>Arena Dev está sem conexão</h1>
    <p>A interface pode abrir offline, mas respostas, presença e estado da aula continuam dependendo do servidor.</p>
    <div class="note">Reconecte à internet e volte para a sessão. O cache nunca é usado como fonte de verdade do domínio.</div>
  </main>
</body>
</html>
