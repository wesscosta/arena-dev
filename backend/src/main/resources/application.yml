server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  application:
    name: arena-dev-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arena_dev}
    username: ${SPRING_DATASOURCE_USERNAME:arena}
    password: ${SPRING_DATASOURCE_PASSWORD:arena123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  allowed-origin-patterns: ${APP_ALLOWED_ORIGIN_PATTERNS:http://*:[3000]}
  teacher:
    username: ${APP_TEACHER_USERNAME:professor}
    password: ${APP_TEACHER_PASSWORD:arena-dev-change-me}
  integrations:
    credential-encryption-key: ${APP_INTEGRATIONS_CREDENTIAL_ENCRYPTION_KEY:}
    microsoft:
      client-id: ${APP_INTEGRATIONS_MICROSOFT_CLIENT_ID:}
      client-secret: ${APP_INTEGRATIONS_MICROSOFT_CLIENT_SECRET:}
      redirect-uri: ${APP_INTEGRATIONS_MICROSOFT_REDIRECT_URI:http://localhost:8080/api/integrations/microsoft/oauth/callback}
    google:
      client-id: ${APP_INTEGRATIONS_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_INTEGRATIONS_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${APP_INTEGRATIONS_GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/oauth/callback}
    notion:
      token: ${APP_INTEGRATIONS_NOTION_TOKEN:}
      api-version: ${APP_INTEGRATIONS_NOTION_API_VERSION:2022-06-28}
      base-url: ${APP_INTEGRATIONS_NOTION_BASE_URL:https://api.notion.com/v1}
      client-id: ${APP_INTEGRATIONS_NOTION_CLIENT_ID:}
      client-secret: ${APP_INTEGRATIONS_NOTION_CLIENT_SECRET:}
      redirect-uri: ${APP_INTEGRATIONS_NOTION_REDIRECT_URI:http://localhost:8080/api/integrations/notion/oauth/callback}
  security:
    login-rate-limit:
      max-failures: ${APP_LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window-seconds: ${APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
      block-seconds: ${APP_LOGIN_RATE_LIMIT_BLOCK_SECONDS:300}
  learning-core:
    quiz-shadow-enabled: ${APP_LEARNING_CORE_QUIZ_SHADOW_ENABLED:false}
    poll-shadow-enabled: ${APP_LEARNING_CORE_POLL_SHADOW_ENABLED:false}
    word-cloud-shadow-enabled: ${APP_LEARNING_CORE_WORD_CLOUD_SHADOW_ENABLED:false}
    cutover:
      minimum-terminal-rounds: ${APP_LEARNING_CORE_CUTOVER_MINIMUM_TERMINAL_ROUNDS:3}
      sample-size: ${APP_LEARNING_CORE_CUTOVER_SAMPLE_SIZE:200}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} [%thread] %logger{36} - %msg%n"
